<head>
  <meta charset="UTF-8">

  <title>login-illustrating.someart</title>
  <link rel="stylesheet" href="style.css">

<body>
  <div class="wrapper">
    <form id="loginForm">
      <h2>Login</h2>
        <div class="input-field">
        <input type="text" id="username" required>
        <label>Masukkan username-mu!</label>
      </div>
      <div class="input-field">
        <input type="password" id="password" required>
        <label>Masukkan password-mu!</label>
      </div>
      <div id="alertBox" style="display:none;color:#ffb3b3;margin-bottom:10px;"></div>
      <button type="submit">Login</button>
      <div class="register">
        <p>belum punya akun nih? <a href="register.html">Register</a></p>
      </div>
    </form>
  </div>
 <script src="js/login.js"></script>
</body>
